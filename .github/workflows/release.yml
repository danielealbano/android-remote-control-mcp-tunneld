name: release

# Cut a release from a `v<semver>` tag: goreleaser builds the multi-arch binaries + archives, pushes
# the multi-arch image to ghcr.io, and creates the GitHub release with the archives + checksums.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release + upload archives/checksums
      packages: write # push multi-arch images to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GoReleaser (multi-arch build + push + release)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Sentry release name and commit range
        id: sentry
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "release=tunneld@${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-list -n 1 "$TAG")" >> "$GITHUB_OUTPUT"
          if prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null); then
            echo "previous_commit=$(git rev-list -n 1 "$prev")" >> "$GITHUB_OUTPUT"
          fi
      - name: Sentry release (commits + finalize)
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          release: ${{ steps.sentry.outputs.release }}
          set_commits: ${{ steps.sentry.outputs.previous_commit && 'manual' || 'auto' }}
          repo: ${{ github.repository }}
          commit: ${{ steps.sentry.outputs.commit }}
          previous_commit: ${{ steps.sentry.outputs.previous_commit }}
          ignore_missing: true
          finalize: true

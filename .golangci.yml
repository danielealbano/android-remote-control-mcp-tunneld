version: "2"

run:
  timeout: 5m

linters:
  # The v2 "standard" default set (errcheck, govet, ineffassign, staticcheck, unused) plus:
  enable:
    - revive
    - gosec
    - misspell
  settings:
    gosec:
      # Rule SELECTION (not violation suppression) for gosec rules that fire ONLY on this design's
      # inherent, provably-safe patterns — consistent with the revive curation + test-file gosec
      # exclusion below:
      #   G115 — integer-overflow conversions are all bounded len()/small-config values (control-frame
      #          length ≤ maxControlPayload=1MiB, lifecycle-days, round-robin index) — cannot overflow.
      #   G304 — file reads are of OPERATOR-CONFIGURED paths (CA cert/key, ACME account keys, ban files);
      #          reading operator config is the whole point, not an inclusion vulnerability.
      #   G402 — the replica mesh client intentionally verifies peers by CA-chain + mesh-role (NOT
      #          hostname: a mesh cert's identity is the node id, not the dial address); resumption-safe
      #          via VerifyConnection. See internal/server/schedulers.go meshPeerVerifier.
      #   G602 — the hand-rolled ClientHello parser guards every slice op with an explicit length check
      #          gosec's flow analysis cannot follow (see internal/edge/clienthello.go).
      excludes:
        - G115
        - G304
        - G402
        - G602
    revive:
      # A curated, high-signal ruleset (style-noise rules like unused-parameter/exported are
      # intentionally omitted; this is rule SELECTION, not suppression of a violation).
      rules:
        - name: blank-imports
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    rules:
      # gosec is a production-security linter; test files exercise edge cases (fixture files, etc.)
      # that are not part of the shipped attack surface.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt

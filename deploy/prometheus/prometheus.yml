global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: tunneld
    # Static target (NOT dns_sd): a stopped replica still yields up==0 so NodeDown can fire — a dns_sd
    # target that fails to resolve would simply disappear. One replica per host; add each host here to
    # scale. The internal listener (:9090) is scraped on the compose network only — never published.
    static_configs:
      - targets: ["tunneld:9090"]

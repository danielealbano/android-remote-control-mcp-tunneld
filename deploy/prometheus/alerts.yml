groups:
  - name: tunneld
    rules:
      - alert: HighRejectionRate
        expr: sum by (reason) (rate(tunneld_rejections_total[5m])) > 10
        for: 10m
        labels: { severity: warning }
      - alert: NoRouteSpike
        expr: sum(rate(tunneld_rejections_total{reason="no-route"}[5m])) > 1
        for: 5m
        labels: { severity: warning }
      - alert: EnrollmentBurst
        expr: sum(increase(tunneld_enrollments_total[10m])) > 50
        labels: { severity: warning }
      - alert: SustainedIngressLimiting
        expr: sum(rate(tunneld_rejections_total{reason=~"conn-rate|max-clients|stream-cap|enroll-limit"}[15m])) > 5
        for: 15m
        labels: { severity: warning }
      - alert: AttestationRejectionSpike
        expr: sum(rate(tunneld_rejections_total{reason=~"attest-.*|csr-mismatch"}[10m])) > 1
        for: 10m
        labels: { severity: warning }
      - alert: ACMEIssuanceFailing
        expr: sum(rate(tunneld_rejections_total{reason="acme-failed"}[15m])) > 0
        for: 15m
        labels: { severity: warning }
      - alert: NodeDown
        expr: up{job="tunneld"} == 0
        for: 2m
        labels: { severity: critical }
